<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>考勤系统客户端下载</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #334372;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .download-btn {
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #2980b9;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
            line-height: 1.8; /* 增加行间距，排版更好看 */
        }

        .driver-link {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .driver-link:hover {
            text-decoration: underline;
        }

        .loading-text {
            color: #3498db;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-box" style="font-size: 50px; margin-bottom: 20px;">📦</div>
    <h2>Atten Desktop</h2>
    <p>官方 Windows 客户端</p>

    <a href="/api/download/attendesktop" class="download-btn" id="dlBtn" onclick="loading()">
        立即下载 (.exe)
    </a>

    <p id="tip" style="display:none;" class="loading-text">🚀 正在准备下载，请稍候...</p>

    <div class="footer">
        <div id="footer-info">正在获取版本信息...</div>
        <div style="margin-top: 8px; color: #666;">
            💡 如果使用指纹设备，请
            <a href="/api/download/zkfingerdevice" class="driver-link">点击下载驱动</a>
        </div>
        <div style="margin-top: 5px;">适用于 Windows 7/10/11</div>
    </div>
</div>

<script>
    function loading() {
        document.getElementById('tip').style.display = 'block';
        setTimeout(() => {
            document.getElementById('tip').style.display = 'none';
        }, 5000);
    }

    fetch('/api/download/latest-info')
        .then(res => {
            if (!res.ok) throw new Error("未找到安装包");
            return res.json();
        })
        .then(data => {
            document.getElementById('footer-info').innerHTML =
                `当前版本: <strong>V${data.version}</strong> | 大小: ${data.size} | 更新日期: ${data.updateTime}`;

            document.getElementById('dlBtn').title = "最新包: " + data.fileName;
        })
        .catch(err => {
            document.getElementById('footer-info').innerText = "暂无可用下载版本";
            const dlBtn = document.getElementById('dlBtn');
            dlBtn.style.backgroundColor = "#ccc";
            dlBtn.style.pointerEvents = "none";
            dlBtn.innerText = "暂无安装包";
        });
</script>
</body>
</html>
