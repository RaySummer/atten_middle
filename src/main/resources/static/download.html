<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>考勤系统客户端下载</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #334372;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .download-btn {
            background-color: #3498db;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background-color: #2980b9;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-box" style="font-size: 50px; margin-bottom: 20px;">📦</div>
    <h2>Atten Desktop</h2>
    <p>官方 Windows 客户端</p>

    <a href="/api/download/desktop" class="download-btn" id="dlBtn" onclick="loading()">
        立即下载 (.exe)
    </a>

    <p id="tip" style="display:none;" class="loading-text">🚀 正在准备下载，请稍候...</p>

    <div class="footer" id="footer-info">
        正在获取版本信息...
    </div>
</div>

<script>
    function loading() {
        document.getElementById('tip').style.display = 'block';
        setTimeout(() => {
            document.getElementById('tip').style.display = 'none';
        }, 5000);
    }

    // 动态获取最新版本信息并填充
    fetch('/api/download/latest-info')
        .then(res => {
            if (!res.ok) throw new Error("未找到安装包");
            return res.json();
        })
        .then(data => {
            // 动态更新页面内容
            document.getElementById('footer-info').innerHTML =
                `当前版本: V${data.version} | 大小: ${data.size}<br>` +
                `更新日期: ${data.updateTime} | 适用于 Win 7/10/11`;

            // 可选：更新下载按钮的 title
            document.getElementById('dlBtn').title = "点击下载 " + data.fileName;
        })
        .catch(err => {
            document.getElementById('footer-info').innerText = "暂无可用下载版本";
            document.getElementById('dlBtn').style.backgroundColor = "#ccc";
            document.getElementById('dlBtn').style.pointerEvents = "none";
        });
</script>
</body>
</html>
