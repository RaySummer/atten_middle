<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工牌打印预览</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* --- 1. 全局样式 --- */
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            color-scheme: light;
        }

        .no-print {
            padding: 15px;
            background: #333;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 999;
            display: block;
        }

        .badge-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--item-width, 230px), 1fr));
            gap: 15px;
            padding: 20px;
            width: 210mm;
            margin: 0 auto;
            background: white;
            min-height: 297mm;
        }

        /* --- 2. 打印专用样式 --- */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
                image-rendering: -webkit-optimize-contrast;
            }

            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
            }

            .badge-list {
                width: 210mm;
                grid-template-columns: repeat(var(--print-cols, 3), 1fr);
                gap: 5px;
                padding: 10mm;
                margin: 0;
                background: white !important;
            }
        }
    </style>
    <style id="dynamic-template-css"></style>
</head>
<body>

<div class="no-print">
    <label>选择尺寸：</label>
    <select id="sizeSelector">
        <option value="small">小 (80%)</option>
        <option value="medium" selected>中 (100%)</option>
        <option value="large">大 (120%)</option>
    </select>
    <button onclick="window.print()" style="margin-left: 15px; cursor: pointer;">直接打印</button>
</div>

<div id="print-area" class="badge-list"></div>

<script>
    let globalPayload = null;

    // 智能处理图片源：自动补全前缀，自动过滤非法路径
    function fixImageSource(str, fieldName) {
        if (!str || typeof str !== 'string') return '';

        let val = str.trim();

        // 1. 如果本身就是合法的路径或已带前缀的Base64，直接返回
        if (val.startsWith('data:') || val.startsWith('http') || (val.startsWith('/') && val.length < 500)) {
            return val;
        }

        // 2. 如果是纯 Base64 (比如你的 UklGR...)，则补全前缀
        const head = val.charAt(0);
        let mime = 'png';
        switch (head) {
            case '/':
                mime = 'jpeg';
                break;
            case 'i':
                mime = 'png';
                break;
            case 'R':
                mime = 'gif';
                break;
            case 'U':
                mime = 'webp';
                break; // 匹配你的 WebP 数据
            default:
                mime = 'png';
        }

        const result = `data:image/${mime};base64,${val}`;
        return result;
    }

    $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const ticket = urlParams.get('ticket');

        $.ajax({
            url: '/api/card-template/payload-by-ticket/' + ticket,
            type: 'GET',
            success: function (response) {
                if (response.status == "200" && response.content) {
                    globalPayload = response.content;
                    renderWithCurrentSize();
                }
            }
        });
        $('#sizeSelector').on('change', renderWithCurrentSize);
    });

    function renderWithCurrentSize() {
        if (!globalPayload) return;

        const template = globalPayload.cardTemplate;
        const employees = globalPayload.employeeList || [];
        const sizeMode = $('#sizeSelector').val();

        // 1. 处理背景图
        const finalBgUrl = fixImageSource(template.bgImageUrl || '');
        if (template.cssContent) {
            let finalCss = template.cssContent.replace(/\${BG_IMAGE_URL}/g, finalBgUrl);
            $('#dynamic-template-css').text(finalCss);
        }

        const container = $('#print-area');
        container.empty();

        employees.forEach((emp, index) => {
            let html = template.htmlContent;

            // --- 核心修改：智能替换循环 ---
            Object.keys(emp).forEach(key => {
                let val = emp[key];

                // 如果这个值是长字符串（可能是Base64），或者是日期
                if (typeof val === 'string') {
                    val = val.trim();

                    // 只要是以 UklGR (WebP) 等特征开头的纯 Base64，不看 key 是什么，直接补全
                    if (!val.startsWith('data:') && !val.startsWith('http') && !val.startsWith('/')) {
                        const head = val.substring(0, 5);
                        if (head.includes('UklGR')) val = 'data:image/webp;base64,' + val;
                        else if (head.includes('iVBOR')) val = 'data:image/png;base64,' + val;
                        else if (head.includes('/9j/')) val = 'data:image/jpeg;base64,' + val;
                        else if (val.length > 100) val = 'data:image/png;base64,' + val; // 兜底
                    }
                }

                if (key.toLowerCase().includes('date')) {
                    val = formatDate(val);
                }

                // 执行替换（不区分大小写）
                const regex = new RegExp(`\\$\\{${key}\\}`, 'gi');
                html = html.replace(regex, val ?? '');
            });

            // 替换公共变量
            html = html.replace(/\${BG_IMAGE_URL}/g, finalBgUrl);
            html = html.replace(/\${SIZE_CLASS}/g, 'size-' + sizeMode);

            container.append(html);
        });
    }

    function formatDate(dateVal) {
        if (!dateVal) return '';
        const d = new Date(dateVal);
        return isNaN(d.getTime()) ? dateVal : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
</script>
</body>
</html>
