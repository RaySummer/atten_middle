<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工牌打印预览 - 增强版</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* --- 全局样式 --- */
        body { background-color: #f0f0f0; margin: 0; padding: 0; font-family: "Microsoft YaHei", sans-serif; }
        .no-print { padding: 15px; background: #333; color: white; text-align: center; position: sticky; top: 0; z-index: 999; }
        .no-print button { padding: 5px 15px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 3px; }

        .badge-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 15px;
            padding: 20px;
            width: 210mm;
            margin: 0 auto;
            background: white;
            min-height: 297mm;
        }

        /* --- 打印专用样式 --- */
        @media print {
            @page { size: A4; margin: 0; }
            .no-print { display: none !important; }
            body { background: white !important; }
            .badge-list {
                width: 210mm;
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
                padding: 10mm;
                margin: 0;
            }
            /* 强制浏览器渲染背景图和颜色 */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        }
    </style>
    <style id="dynamic-template-css"></style>
</head>
<body>

<div class="no-print">
    <label>工牌尺寸：</label>
    <select id="sizeSelector">
        <option value="small">小 (80%)</option>
        <option value="medium" selected>中 (100%)</option>
        <option value="large">大 (120%)</option>
    </select>
    <button onclick="window.print()">确认打印</button>
</div>

<div id="print-area" class="badge-list"></div>

<script>
    let globalPayload = null;

    /**
     * 高级图片处理函数：识别多种指纹仪和相机生成的 Base64 格式
     */
    function smartProcessImage(rawStr) {
        if (!rawStr || typeof rawStr !== 'string' || rawStr.length < 30) return '';

        let str = rawStr.trim();

        // 1. 如果已经是完整的 DataURI 或 URL，直接返回
        if (str.startsWith('data:image/') || str.startsWith('http')) return str;

        // 2. 通过文件头特征码识别 MIME 类型 (Base64 编码后的特征)
        // 取前 20 位进行特征匹配
        const head = str.substring(0, 20);
        let mime = 'png'; // 默认值

        if (head.includes('Qk0')) {
            mime = 'bmp';      // 指纹仪常见的 BMP 格式
        } else if (head.includes('iVBOR')) {
            mime = 'png';      // 标准 PNG
        } else if (head.includes('/9j/')) {
            mime = 'jpeg';     // 标准 JPG
        } else if (head.includes('UklGR')) {
            mime = 'webp';     // Google WebP
        } else if (head.includes('R0lGOD')) {
            mime = 'gif';      // GIF
        } else if (head.includes('AAAAF')) {
            mime = 'mp4';      // 误传的视频头
        }

        return `data:image/${mime};base64,${str}`;
    }

    /**
     * 日期格式化
     */
    function formatDate(dateVal) {
        if (!dateVal) return '';
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal;
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const ticket = urlParams.get('ticket');

        if (!ticket) {
            alert("未检测到打印凭证(Ticket)");
            return;
        }

        $.ajax({
            url: '/api/card-template/payload-by-ticket/' + ticket,
            type: 'GET',
            success: function (res) {
                if (res.status == "200" && res.content) {
                    globalPayload = res.content;
                    renderWithCurrentSize();
                } else {
                    alert("加载数据失败: " + (res.message || "未知错误"));
                }
            },
            error: function() {
                alert("网络请求异常，无法获取打印数据");
            }
        });

        $('#sizeSelector').on('change', renderWithCurrentSize);
    });

    /**
     * 核心渲染函数
     */
    function renderWithCurrentSize() {
        if (!globalPayload) return;

        const template = globalPayload.cardTemplate;
        const employees = globalPayload.employeeList || [];
        const sizeMode = $('#sizeSelector').val();
        const container = $('#print-area');

        container.empty();

        // 1. 处理模板背景图逻辑
        const finalBgUrl = smartProcessImage(template.bgImageUrl || '');
        if (template.cssContent) {
            // 全局替换 CSS 里的背景占位符
            let finalCss = template.cssContent.replace(/\$\{BG_IMAGE_URL\}/g, finalBgUrl);
            $('#dynamic-template-css').text(finalCss);
        }

        // 2. 遍历渲染每个员工
        employees.forEach((emp) => {
            let html = template.htmlContent;

            // 预处理员工的所有属性
            const processedEmp = {};
            Object.keys(emp).forEach(key => {
                let val = emp[key];

                if (typeof val === 'string') {
                    // 如果是疑似 Base64 图片 (根据长度和特征判断)
                    if (val.length > 50 || key.toLowerCase().includes('photo') || key.toLowerCase().includes('fingerprint')) {
                        processedEmp[key] = smartProcessImage(val);
                    } else if (key.toLowerCase().includes('date')) {
                        processedEmp[key] = formatDate(val);
                    } else {
                        processedEmp[key] = val;
                    }
                } else {
                    processedEmp[key] = val ?? '';
                }
            });

            // 执行 HTML 变量替换
            // 使用正则替换所有 ${key}，不区分大小写
            Object.keys(processedEmp).forEach(key => {
                const regex = new RegExp(`\\$\\{${key}\\}`, 'gi');
                html = html.replace(regex, processedEmp[key]);
            });

            // 替换公共环境变量
            html = html.replace(/\$\{BG_IMAGE_URL\}/g, finalBgUrl);
            html = html.replace(/\$\{SIZE_CLASS\}/g, 'size-' + sizeMode);

            container.append(html);
        });

        console.log("渲染完成，共计 " + employees.length + " 张工牌");
    }
</script>
</body>
</html>
