<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>工牌打印预览</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* --- 1. 全局样式 --- */
        body {
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
            /* 强制浏览器渲染色彩 */
            color-scheme: light;
        }

        .no-print {
            padding: 15px;
            background: #333;
            color: white;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 999;
            display: block;
        }

        .badge-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--item-width, 230px), 1fr));
            gap: 15px;
            padding: 20px;
            width: 210mm;
            margin: 0 auto;
            background: white;
            min-height: 297mm;
        }

        /* --- 2. 打印专用样式 --- */
        @media print {
            @page {
                size: A4;
                margin: 0; /* 移除浏览器默认页眉页脚 */
            }

            * {
                /* 核心：强制显示背景和彩色 */
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;
                /* 确保图片渲染质量 */
                image-rendering: -webkit-optimize-contrast;
            }

            .no-print {
                display: none !important;
            }

            body {
                background: white !important;
                -webkit-print-color-adjust: exact;
            }

            .badge-list {
                width: 210mm; /* 严格对齐 A4 */
                grid-template-columns: repeat(var(--print-cols, 3), 1fr);
                gap: 5px;
                padding: 10mm; /* 给打印留一点边距 */
                margin: 0;
                background: white !important;
            }
        }
    </style>
    <style id="dynamic-template-css"></style>
</head>
<body>

<div class="no-print">
    <label>工牌尺寸：</label>
    <select id="sizeSelector">
        <option value="small">小 (80%)</option>
        <option value="medium" selected>中 (100%)</option>
        <option value="large">大 (120%)</option>
    </select>
    <button onclick="window.print()">确认打印</button>
</div>

<div id="print-area" class="badge-list"></div>

<script>
    let globalPayload = null;

    /**
     * 高级图片处理函数：识别多种指纹仪和相机生成的 Base64 格式
     */
    function smartProcessImage(rawStr) {
        if (!rawStr || typeof rawStr !== 'string' || rawStr.length < 30) return '';

        let str = rawStr.trim();

        // 1. 如果已经是完整的 DataURI 或 URL，直接返回
        if (str.startsWith('data:image/') || str.startsWith('http')) return str;

        // 2. 通过文件头特征码识别 MIME 类型 (Base64 编码后的特征)
        // 取前 20 位进行特征匹配
        const head = str.substring(0, 20);
        let mime = 'png'; // 默认值

        if (head.includes('Qk0')) {
            mime = 'bmp';      // 指纹仪常见的 BMP 格式
        } else if (head.includes('iVBOR')) {
            mime = 'png';      // 标准 PNG
        } else if (head.includes('/9j/')) {
            mime = 'jpeg';     // 标准 JPG
        } else if (head.includes('UklGR')) {
            mime = 'webp';     // Google WebP
        } else if (head.includes('R0lGOD')) {
            mime = 'gif';      // GIF
        } else if (head.includes('AAAAF')) {
            mime = 'mp4';      // 误传的视频头
        }

        return `data:image/${mime};base64,${str}`;
    }

    /**
     * 日期格式化
     */
    function formatDate(dateVal) {
        if (!dateVal) return '';
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal;
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    $(document).ready(function () {
        const urlParams = new URLSearchParams(window.location.search);
        const ticket = urlParams.get('ticket');

        if (!ticket) {
            alert("未检测到打印凭证(Ticket)");
            return;
        }

        $.ajax({
            url: '/api/card-template/payload-by-ticket/' + ticket,
            type: 'GET',
            success: function (res) {
                if (res.status == "200" && res.content) {
                    globalPayload = res.content;
                    renderWithCurrentSize();
                } else {
                    alert("加载数据失败: " + (res.message || "未知错误"));
                }
            },
            error: function () {
                alert("网络请求异常，无法获取打印数据");
            }
        });

        $('#sizeSelector').on('change', renderWithCurrentSize);
    });

    /**
     * 核心渲染函数
     */
    function renderWithCurrentSize() {
        if (!globalPayload) return;

        const template = globalPayload.cardTemplate;
        const employees = globalPayload.employeeList || [];
        const sizeMode = $('#sizeSelector').val();
        const container = $('#print-area');

        const isHorizontal = template.layout === 'horizontal';
        console.log(isHorizontal)
        const baseWidth = template.baseWidth || (isHorizontal ? 370 : 230);
        const scale = {small: 0.8, medium: 1, large: 1.2}[sizeMode];
        const finalWidth = baseWidth * scale;
        const printCols = isHorizontal ? 3 : 2;

        console.log(printCols)
        container.css({'--item-width': finalWidth + 'px', '--print-cols': printCols});
        container.empty();

        // 1. 处理模板背景图（底图）
        // 这里的 finalBgUrl 是从模板配置里拿到的全局底图
        const finalBgUrl = smartProcessImage(template.bgImageUrl || '');

        // 2. 注入动态 CSS
        if (template.cssContent) {
            // 这里替换 CSS 中的变量，确保样式表里的 url() 是有效的
            let finalCss = template.cssContent.replace(/\$\{BG_IMAGE_URL\}/g, template.bgImageUrl || '');
            $('#dynamic-template-css').text(finalCss);
        }

        // 3. 遍历渲染每个员工
        employees.forEach((emp) => {
            // 💡 重点：每次循环都重新获取干净的 HTML 模板内容
            let html = template.htmlContent;

            // 预处理员工属性
            const processedValues = {};
            Object.keys(emp).forEach(key => {
                let val = emp[key];
                if (typeof val === 'string') {
                    // 图片识别逻辑
                    if (val.length > 50 || key.toLowerCase().includes('photo') || key.toLowerCase().includes('fingerprint')) {
                        processedValues[key] = smartProcessImage(val);
                    } else if (key.toLowerCase().includes('date')) {
                        processedValues[key] = formatDate(val);
                    } else {
                        processedValues[key] = val;
                    }
                } else {
                    processedValues[key] = val ?? '';
                }
            });

            // --- 开始执行替换 ---

            // A. 先替换员工特定的数据 (如 ${name}, ${pin}, ${photoBase64})
            Object.keys(processedValues).forEach(key => {
                const regex = new RegExp(`\\$\\{${key}\\}`, 'gi');
                html = html.replace(regex, processedValues[key]);
            });

            // B. 再替换每个工牌里的底图占位符 ${BG_IMAGE_URL}
            // 确保每个工牌生成的 HTML 里，底图占位符都被正确替换成 base64 图片地址
            const bgRegex = new RegExp(`\\$\\{BG_IMAGE_URL\\}`, 'g');
            html = html.replace(bgRegex, finalBgUrl);

            // C. 替换尺寸样式
            console.log(template.bgImageUrl);
            html = html.replace(/\$\{SIZE_CLASS\}/g, 'size-' + sizeMode);
            html = html.replace(/\${BG_IMAGE_URL}/g, template.bgImageUrl || '');
            // 将生成的工牌 HTML 加入容器
            container.append(html);
        });

        console.log("渲染完成，共计 " + employees.length + " 张工牌");
    }
</script>
</body>
</html>
